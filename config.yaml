app:
  name: OpenID Connect Server
  env: development
  url: http://localhost:8080
  description: OpenID Connect Server API and administration console.

server:
  host: 0.0.0.0
  port: 8080
  readTimeout: 15s
  writeTimeout: 15s
  idleTimeout: 60s
  shutdownTimeout: 10s

logging:
  level: info
  format: text

storage:
  dataDir: data

auth:
  sessionTTL: 8h
  cookieSecure: false # development HTTP only

ui:
  defaultTheme: auto
  repoURL: https://github.com/prasenjit-net/openid-connect-server
  devProxyURL: http://localhost:5173

oidc:
  enabled: true
  issuer: http://localhost:8080
  refreshMaxTTL: 720h
  refreshInactivityTTL: 168h
  registrationEnabled: true
  allowedOrigins:
    - http://127.0.0.1:9999

oauth:
  refreshTokensEnabled: true
  passwordGrantEnabled: true
  resources:
    - audience: https://api.example.com
      enabled: true
      scopes: [read, write]